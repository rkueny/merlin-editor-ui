name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # needed to create the GitHub Release

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: merlin-editor-macos
            package_cmd: |
              cd dist
              ditto -c -k --sequesterRsrc --keepParent "Merlin Editor.app" merlin-editor-macos.zip
          - os: ubuntu-latest
            artifact_name: merlin-editor-linux
            package_cmd: |
              cd dist
              tar -czf merlin-editor-linux.tar.gz merlin-editor
          - os: windows-latest
            artifact_name: merlin-editor-windows
            package_cmd: |
              cd dist
              Compress-Archive -Path merlin-editor -DestinationPath merlin-editor-windows.zip

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 Pillow pyinstaller

      - name: Fetch ffmpeg (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p bin
          curl -L https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip -o ffmpeg.zip
          unzip -o ffmpeg.zip -d bin
          chmod +x bin/ffmpeg
          ./bin/ffmpeg -version | head -1

      - name: Fetch ffmpeg (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p bin
          curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ffmpeg.tar.xz
          tar -xJf ffmpeg.tar.xz
          cp ffmpeg-*-amd64-static/ffmpeg bin/ffmpeg
          chmod +x bin/ffmpeg
          ./bin/ffmpeg -version | head -1

      - name: Fetch ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extracted -Force
          $exe = Get-ChildItem ffmpeg-extracted -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName bin/ffmpeg.exe
          .\bin\ffmpeg.exe -version | Select-Object -First 1

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean merlin-editor.spec

      - name: Package
        shell: bash
        if: matrix.os != 'windows-latest'
        run: ${{ matrix.package_cmd }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ${{ matrix.package_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/merlin-editor-macos.zip
            dist/merlin-editor-linux.tar.gz
            dist/merlin-editor-windows.zip
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## Install

            ffmpeg is bundled — nothing else to install.

            **macOS** — download `merlin-editor-macos.zip`, unzip, drag `Merlin Editor.app` to Applications. The app is not notarised, so Gatekeeper will block the first launch. Bypass with:
            - Terminal (fastest): `xattr -dr com.apple.quarantine "/Applications/Merlin Editor.app"` then double-click.
            - GUI: click *Done* on the warning, then **System Settings → Privacy & Security → Open Anyway**.

            **Linux** — download `merlin-editor-linux.tar.gz`, extract, run `./merlin-editor/merlin-editor`.

            **Windows** — download `merlin-editor-windows.zip`, extract, run `merlin-editor\merlin-editor.exe`.

            ## Third-party

            Includes FFmpeg (LGPLv2.1+ on macOS/Windows, GPLv3 on Linux). See `THIRD_PARTY_NOTICES.md` in the bundle.
